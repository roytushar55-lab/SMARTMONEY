# Deploys the API to Azure App Service on every push to main that touches
# the backend (a merged pull request), or on demand from the Actions tab.
#
# A push to main IS a production deploy. Work on branches and merge through
# pull requests, where the CI workflow runs first.
#
# Signs in to Azure with OpenID Connect: no Azure password or publish profile
# is stored in GitHub. One-time setup: backend/tools/azure/setup-github-oidc.ps1,
# then add these in GitHub > Settings > Secrets and variables > Actions >
# Variables:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (printed by the script)
#   AZURE_WEBAPP_NAME                                         e.g. smartmoney-api-st01
#   API_HEALTH_URL (optional)                                 e.g. https://api.smart-money.in/health
#
# App settings and secrets stay in App Service (deploy-api.ps1 -SkipCode);
# this workflow only ships code. Database migrations are NOT run here: apply
# them by hand before merging a change that needs one (Azure guide, Step 11).
name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/SmartMoney.slnx"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one half way.
concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/SmartMoney.slnx

      - name: Test
        run: dotnet test backend/tests/SmartMoney.Application.Tests --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish backend/src/SmartMoney.Api/SmartMoney.Api.csproj
          --configuration Release --no-restore
          --output ${{ runner.temp }}/api

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ runner.temp }}/api
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to App Service
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The "production" environment can require an approval before each
    # deploy (GitHub > Settings > Environments). The Azure sign-in trusts
    # exactly this environment.
    environment:
      name: production
      url: ${{ vars.API_HEALTH_URL || format('https://{0}.azurewebsites.net/health', vars.AZURE_WEBAPP_NAME) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check configuration
        run: |
          missing=""
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_WEBAPP_NAME; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions variables:$missing (see the top of deploy-api.yml)"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      - name: Sign in to Azure (OpenID Connect)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: api

      - name: Wait for /health
        run: |
          url="${API_HEALTH_URL:-https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health}"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$url" || true)
            if [ "$body" = "Healthy" ]; then
              echo "Healthy: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$url did not answer Healthy within 5 minutes. Check: az webapp log tail -g <resource group> -n $AZURE_WEBAPP_NAME"
          exit 1
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

      - name: Sign out
        if: always()
        run: az logout || true
