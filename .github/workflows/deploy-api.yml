# Deploys the API when a pull request is merged:
#   merged into dev  -> UAT   (smartmoney-api-uat)
#   merged into main -> PROD  (smartmoney-api-prod)
# Flow: feature branch -> PR into dev (CI runs) -> merge -> UAT deploys ->
# test on UAT -> PR dev into main (CI runs) -> merge -> PROD deploys.
#
# A push to dev or main deploys too (the free GitHub plan cannot block direct
# pushes), so always go through pull requests.
#
# Signs in to Azure with OpenID Connect, one identity per target: the UAT
# identity trusts only the dev branch and can deploy only the UAT app; the
# PROD identity trusts only main and can deploy only the PROD app. No Azure
# password is stored in GitHub. One-time setup: setup-github-oidc.ps1 (run
# twice), then add these under Settings > Secrets and variables > Actions >
# Variables:
#   AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   AZURE_CLIENT_ID_UAT,  AZURE_WEBAPP_NAME_UAT,  API_HEALTH_URL_UAT
#   AZURE_CLIENT_ID_PROD, AZURE_WEBAPP_NAME_PROD, API_HEALTH_URL_PROD
#
# App settings and secrets stay in App Service (deploy-api.ps1 -SkipCode);
# this workflow only ships code. Database migrations are NOT run here: apply
# them by hand with the owner login, UAT first, before merging.
name: Deploy API

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "backend/src/**"
      - "backend/tests/**"
      - "backend/SmartMoney.slnx"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy per target at a time, never cancelled half way.
concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: Test and publish
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore backend/SmartMoney.slnx

      - name: Test
        run: dotnet test backend/tests/SmartMoney.Application.Tests --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish backend/src/SmartMoney.Api/SmartMoney.Api.csproj
          --configuration Release --no-restore
          --output ${{ runner.temp }}/api

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ${{ runner.temp }}/api
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'PROD' || 'UAT' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Choose target
        id: target
        env:
          REF: ${{ github.ref_name }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          UAT_CLIENT: ${{ vars.AZURE_CLIENT_ID_UAT }}
          UAT_APP: ${{ vars.AZURE_WEBAPP_NAME_UAT }}
          UAT_HEALTH: ${{ vars.API_HEALTH_URL_UAT }}
          PROD_CLIENT: ${{ vars.AZURE_CLIENT_ID_PROD }}
          PROD_APP: ${{ vars.AZURE_WEBAPP_NAME_PROD }}
          PROD_HEALTH: ${{ vars.API_HEALTH_URL_PROD }}
        run: |
          case "$REF" in
            main) name=PROD; client="$PROD_CLIENT"; app="$PROD_APP"; health="$PROD_HEALTH" ;;
            dev)  name=UAT;  client="$UAT_CLIENT";  app="$UAT_APP";  health="$UAT_HEALTH" ;;
            *)    echo "::error::Deploys run only from dev (UAT) or main (PROD), not '$REF'."; exit 1 ;;
          esac
          missing=""
          [ -z "$TENANT" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$SUBSCRIPTION" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -z "$client" ] && missing="$missing AZURE_CLIENT_ID_$name"
          [ -z "$app" ] && missing="$missing AZURE_WEBAPP_NAME_$name"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions variables:$missing (see the top of deploy-api.yml)"
            exit 1
          fi
          [ -z "$health" ] && health="https://$app.azurewebsites.net/health"
          {
            echo "name=$name"
            echo "client=$client"
            echo "app=$app"
            echo "health=$health"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $REF to $name ($app)"

      - uses: actions/download-artifact@v4
        with:
          name: api
          path: api

      - name: Sign in to Azure (OpenID Connect)
        uses: azure/login@v2
        with:
          client-id: ${{ steps.target.outputs.client }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.target.outputs.app }}
          package: api

      - name: Wait for /health
        env:
          URL: ${{ steps.target.outputs.health }}
          APP: ${{ steps.target.outputs.app }}
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 20 "$URL" || true)
            if [ "$body" = "Healthy" ]; then
              echo "Healthy: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL did not answer Healthy within 5 minutes. Check: az webapp log tail -g smartmoney-rg -n $APP"
          exit 1

      - name: Sign out
        if: always()
        run: az logout || true
